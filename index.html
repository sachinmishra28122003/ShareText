<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirText — Instant P2P Sync & Transfer</title>
  <link rel="stylesheet" href="./style.css?v=2.0.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.3/paho-mqtt.min.js"></script>
  
  <!-- PeerJS for WebRTC Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Fast QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="top-nav">
    <div class="brand">AirText<span>.io</span></div>
    <div class="nav-tools">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Standby</span>
      </div>
      <button class="nav-btn" id="qrBtn" title="Pair via QR">📱 QR</button>
      <button class="nav-btn" id="themeBtn" title="Toggle Theme">🌙</button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="workspace">
    <header class="hero">
      <h1>Share Text & Files Instantly</h1>
      <p>Direct WebRTC P2P sync. Real-time text mirror and encrypted file sharing.</p>
    </header>

    <!-- Room Control Bar -->
    <section class="room-bar">
      <div class="room-current">
        <span>Room:</span>
        <span class="room-code" id="roomCodeDisplay">...</span>
        <button class="nav-btn" id="copyLinkBtn">Copy Link</button>
        <button class="btn-reset" id="resetRoomBtn" title="Reset room and clear cache">Reset Room 🔄</button>
      </div>
      <div class="room-inputs">
        <input type="text" id="joinInput" placeholder="Join room code..." maxlength="20" />
        <button class="btn-accent" id="joinBtn">Join</button>
      </div>
    </section>

    <!-- Notepad & File Transfer Card -->
    <section class="editor-container" id="editorCard">
      <div class="editor-top">
        <span id="networkText">Initializing network...</span>
        <span class="flash-pulse" id="flash">Synced</span>
      </div>
      <textarea id="editor" placeholder="Type prompt, notes, or code here..." spellcheck="false"></textarea>
      
      <!-- Received / Sent Files Deck -->
      <div class="files-deck" id="filesDeck"></div>

      <div class="editor-bottom">
        <div class="meta">
          <span id="chars">0 characters</span>
          <span>•</span>
          <span id="peerLabel">0 devices connected</span>
        </div>
        <div class="actions">
          <input type="file" id="fileInput" style="display: none;" />
          <button class="btn-sm" id="sendFileBtn" title="Send a file to connected device">📎 Send File</button>
          <button class="btn-sm" id="clearBtn">Clear</button>
          <button class="btn-sm primary" id="copyBtn">Copy Text</button>
        </div>
      </div>
    </section>
  </main>

  <!-- QR Pairing Modal -->
  <div class="modal-wrap" id="qrModal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3>Scan to Pair Device</h3>
      <p class="modal-sub">Scan with phone camera to connect automatically</p>
      <div id="qrCanvas"></div>
      <button class="btn-sm" id="closeModalBtn" style="width: 100%;">Close</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./app.js?v=2.0.0"></script>
</body>
</html>
