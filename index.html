<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirText — Instant P2P Sync</title>
  
  <link rel="stylesheet" href="./style.css?v=1.0.1" />
  <!-- PeerJS for WebRTC DataChannel Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="top-nav">
    <div class="brand">AirText<span>.io</span></div>
    <div class="nav-tools">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Standby</span>
      </div>
      <button class="nav-btn" id="qrBtn">📱 QR</button>
      <button class="nav-btn" id="themeBtn">🌙</button>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="workspace">
    <div class="hero">
      <h1>Share Text Instantly</h1>
      <p>Multi-device WebRTC sync. Type or paste below to mirror in real time.</p>
    </div>

    <!-- Room Control Bar -->
    <div class="room-bar">
      <div class="room-current">
        <span>Room:</span>
        <span class="room-code" id="roomCodeDisplay">...</span>
        <button class="nav-btn" id="copyLinkBtn">Copy Link</button>
        <button class="btn-reset" id="resetRoomBtn" title="Destroy session and start fresh">Reset Room 🔄</button>
      </div>
      <div class="room-inputs">
        <input type="text" id="joinInput" placeholder="Join room..." maxlength="20" />
        <button class="btn-accent" id="joinBtn">Set</button>
      </div>
    </div>

    <!-- Notepad Card -->
    <div class="editor-container">
      <div class="editor-top">
        <span id="networkText">Connecting to room...</span>
        <span class="flash-pulse" id="flash">Synced</span>
      </div>
      <textarea id="editor" placeholder="Type prompt or code here..."></textarea>
      <div class="editor-bottom">
        <div class="meta">
          <span id="chars">0 characters</span>
          <span>•</span>
          <span id="peerLabel">0 devices connected</span>
        </div>
        <div class="actions">
          <button class="btn-sm" id="clearBtn">Clear</button>
          <button class="btn-sm primary" id="copyBtn">Copy Prompt</button>
        </div>
      </div>
    </div>
  </div>

  <!-- QR Modal -->
  <div class="modal-wrap" id="qrModal">
    <div class="modal-card">
      <h3>Scan to Join Room</h3>
      <p class="modal-sub">Share this QR code with any device</p>
      <canvas id="qrCanvas"></canvas>
      <button class="btn-sm" id="closeModalBtn" style="width: 100%;">Close</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
